name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Switch to `npm ci` (and add `cache: npm` above) once package-lock.json is committed.
      - run: npm install --no-audit --no-fund
      - name: Test
        run: |
          code=0; NO_COLOR=1 FORCE_COLOR=0 npx vitest run > vitest.out 2>&1 || code=$?
          if [ $code -ne 0 ]; then python3 -c "import sys; t=open(sys.argv[1]).read()[:3500]; print('::error title='+sys.argv[2]+'::'+t.replace('%','%25').replace(chr(13),'').replace(chr(10),'%0A'))" vitest.out vitest; fi
          exit $code

      - run: npm run build
        env:
          BASE_PATH: /identity-device-dashboard/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
