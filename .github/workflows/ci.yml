name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Switch to `npm ci` (and add `cache: npm` above) once package-lock.json is committed.
      - run: npm install --no-audit --no-fund
      - name: Typecheck
        run: |
          code=0; npx tsc --noEmit --pretty false > tsc.out 2>&1 || code=$?
          if [ $code -ne 0 ]; then python3 -c "import sys; t=open(sys.argv[1]).read()[:3500]; print('::error title='+sys.argv[2]+'::'+t.replace('%','%25').replace(chr(13),'').replace(chr(10),'%0A'))" tsc.out tsc; fi
          exit $code

      - name: Test
        run: |
          code=0; NO_COLOR=1 FORCE_COLOR=0 npx vitest run > vitest.out 2>&1 || code=$?
          if [ $code -ne 0 ]; then python3 -c "import sys; t=open(sys.argv[1]).read()[:3500]; print('::error title='+sys.argv[2]+'::'+t.replace('%','%25').replace(chr(13),'').replace(chr(10),'%0A'))" vitest.out vitest; fi
          exit $code

      - run: npm run build
