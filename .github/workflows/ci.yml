name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Switch to `npm ci` (and add `cache: npm` above) once package-lock.json is committed.
      - run: npm install --no-audit --no-fund
      - name: Typecheck
        run: |
          npx tsc --noEmit --pretty false > tsc.out 2>&1; code=$?
          if [ $code -ne 0 ]; then echo "::error title=tsc::$(head -c 3500 tsc.out | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"; fi
          exit $code

      - name: Test
        run: |
          npx vitest run > vitest.out 2>&1; code=$?
          if [ $code -ne 0 ]; then echo "::error title=vitest::$(sed 's/\x1b\[[0-9;]*m//g' vitest.out | grep -v '^\s*$' | head -c 3500 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"; fi
          exit $code
      - run: npm run build
